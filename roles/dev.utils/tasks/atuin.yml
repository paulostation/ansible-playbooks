---
- name: Check if Atuin is already installed
  stat:
    path: "/home/{{ ansible_user }}/.atuin/bin/atuin"
  register: atuin_binary

- name: Download and install Atuin
  become: false
  # Must run under bash, not the default /bin/sh (dash on Debian/Ubuntu).
  # The installer's `exec 3</dev/tty` TTY-detection, under `set -eu` with no
  # controlling tty (as under Ansible), is fatal in dash but not bash — it
  # kills the script before any output, surfacing as a bare rc=2.
  # --non-interactive also skips the import/register/sync prompts, which
  # have no tty to read from here anyway.
  shell: curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | bash -s -- --non-interactive
  args:
    executable: /bin/bash
    creates: "/home/{{ ansible_user }}/.atuin/bin/atuin"
  when: not atuin_binary.stat.exists

- name: Remove installer's own .zshrc append (chezmoi owns atuin init; see above)
  lineinfile:
    path: "/home/{{ ansible_user }}/.zshrc"
    regexp: '^eval "\$\(atuin init zsh\)"$'
    state: absent
  when: not atuin_binary.stat.exists

- name: Check for a chezmoi-managed dotfiles source
  stat:
    path: "/home/{{ ansible_user }}/.local/share/chezmoi"
  register: chezmoi_source_dir
  when: not atuin_binary.stat.exists

# Backstop for the above: the binary installer invoked by setup.atuin.sh
# (atuin-installer.sh) also appends its own PATH-setup line to .zshrc, with
# wording that isn't pinned to a version and could change. Rather than chase
# every line an upstream installer might write, reconcile .zshrc back to the
# chezmoi source of truth wholesale.
- name: Reconcile .zshrc via chezmoi apply (catches any other installer writes)
  become: false
  command: chezmoi apply --force
  when:
    - not atuin_binary.stat.exists
    - chezmoi_source_dir.stat.exists | default(false)
  changed_when: true

- name: Ensure Atuin config directory exists
  file:
    path: "/home/{{ ansible_user }}/.config/atuin"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy Atuin configuration
  template:
    src: atuin-config.toml.j2
    dest: "/home/{{ ansible_user }}/.config/atuin/config.toml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# No .zshrc management here: chezmoi (see dev.utils's chezmoi role, run
# earlier in this playbook) owns .zshrc and sources a per-host
# .zshrc.local.tmpl that already inits atuin when ~/.atuin/bin/env exists.
# A blockinfile task here would double-init (on top of what setup.atuin.sh's
# own installer appends) and get silently reverted by the next `chezmoi
# apply`, the same drift bug fixed for the asdf role.

- name: Check if Atuin session exists
  stat:
    path: "/home/{{ ansible_user }}/.local/share/atuin/session"
  register: atuin_session

- name: Atuin login (if credentials provided and not logged in)
  become: false
  shell: |
    export PATH="$HOME/.atuin/bin:$PATH"
    atuin login -u "{{ atuin_username }}" -p "{{ atuin_password }}"{% if atuin_key is defined %} -k "{{ atuin_key }}"{% endif %}

  args:
    creates: "/home/{{ ansible_user }}/.local/share/atuin/session"
  when:
    - atuin_sync_enabled | bool
    - atuin_username is defined
    - atuin_password is defined
    - not atuin_session.stat.exists
  register: atuin_login
  ignore_errors: true
  no_log: true

- name: Atuin register (if login failed and credentials provided)
  become: false
  shell: |
    export PATH="$HOME/.atuin/bin:$PATH"
    atuin register -u "{{ atuin_username }}" -e "{{ atuin_email }}" -p "{{ atuin_password }}"
  args:
    creates: "/home/{{ ansible_user }}/.local/share/atuin/session"
  when:
    - atuin_sync_enabled | bool
    - atuin_username is defined
    - atuin_email is defined
    - atuin_password is defined
    - not atuin_session.stat.exists
    - atuin_login is failed
  no_log: true

- name: Check if history was already imported
  stat:
    path: "/home/{{ ansible_user }}/.local/share/atuin/.history_imported"
  register: atuin_history_imported

- name: Import shell history to Atuin
  become: false
  shell: |
    export PATH="$HOME/.atuin/bin:$PATH"
    atuin import auto
    touch ~/.local/share/atuin/.history_imported
  args:
    creates: "/home/{{ ansible_user }}/.local/share/atuin/.history_imported"
  when:
    - atuin_import_history | bool
    - not atuin_history_imported.stat.exists

- name: Initial Atuin sync
  become: false
  shell: |
    export PATH="$HOME/.atuin/bin:$PATH"
    atuin sync
  when:
    - atuin_sync_enabled | bool
    - atuin_username is defined
  changed_when: false
  ignore_errors: true
