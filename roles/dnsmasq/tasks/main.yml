---
# Dnsmasq Role - Main Tasks

- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
  become: true

- name: Stop systemd-resolved (conflicts with dnsmasq)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  become: true
  ignore_errors: true

- name: Configure dnsmasq
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    mode: '0644'
    owner: root
    group: root
    backup: true
  become: true
  notify: Restart dnsmasq

- name: Deploy DNS records
  ansible.builtin.template:
    src: records.conf.j2
    dest: /etc/dnsmasq.d/records.conf
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: Restart dnsmasq

- name: Find unmanaged dnsmasq.d config files
  ansible.builtin.find:
    paths: /etc/dnsmasq.d
    patterns: "*.conf"
    excludes:
      - records.conf
  register: unmanaged_conf_files
  become: true

- name: Remove unmanaged dnsmasq.d config files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ unmanaged_conf_files.files }}"
  become: true
  notify: Restart dnsmasq

- name: Remove legacy hosts.local file
  ansible.builtin.file:
    path: /etc/hosts.local
    state: absent
  become: true
  notify: Restart dnsmasq

- name: Configure resolv.conf to use local DNS
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - use local dnsmasq
      nameserver 127.0.0.1
    dest: /etc/resolv.conf
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
  become: true
