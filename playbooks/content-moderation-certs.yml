---
- name: Deploy Content Moderation Pipeline certificates
  hosts: omarchy-mouse
  become: true
  gather_facts: false
  pre_tasks:
    - include_role:
        name: config_loader

  roles:
    - role: content_moderation_certs
      vars:
        cm_step_ca_provisioner_password: "{{ vector_step_ca_provisioner_password }}"
