---
# VPN Hub - Main Playbook
# Configures AWS Lightsail instance as WireGuard VPN hub and DNS server

- name: Configure VPN Hub
  hosts: aws_vpn_hub
  become: true
  gather_facts: false

  pre_tasks:
    - include_role:
        name: config_loader

    - name: Build WireGuard peers list from config store
      vars:
        _peer_pubkeys: "{{ group_vars.aws_vpn_hub.vpn_peer_pubkeys | default(vpn_peer_pubkeys | default({})) }}"
      ansible.builtin.set_fact:
        wireguard_peers: "{{ wireguard_peers | default([]) + [{'name': item.name, 'public_key': _peer_pubkeys[item.name], 'allowed_ips': item.ip ~ '/32'}] }}"
      loop: "{{ vpn.peers }}"
      when: _peer_pubkeys | length > 0 and item.name in _peer_pubkeys

    - name: Wait for cloud-init to complete
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      ignore_errors: true

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: wireguard_server
      tags: [wireguard, vpn]

    - role: dnsmasq
      tags: [dns, dnsmasq]

  post_tasks:
    - name: Display connection info
      ansible.builtin.debug:
        msg: |
          =====================================================
          VPN Hub configured successfully!
          =====================================================

          WireGuard Hub:
            Server IP: {{ vpn.server_ip }}
            Endpoint: {{ vpn.server_endpoint | default(ansible_host ~ ':' ~ vpn.port) }}

          DNS:
            Domain: {{ domain }}
            Resolver: {{ vpn.server_ip }}

          Peers configured: {{ wireguard_peers | length }}
          {% for peer in wireguard_peers %}
            - {{ peer.name }}: {{ peer.allowed_ips }}
          {% endfor %}

          Server Public Key (for client configs):
            Run: sudo cat /etc/wireguard/publickey

          =====================================================
